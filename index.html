<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logística Unificada - Santa Adélia</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        :root {
            --usa-verde-escuro: #004A2F;
            --usa-verde-medio: #1b5e39;
            --usa-verde-claro: #B2D969;
            --usa-verde-glow: #8bc34a;
            --bg-dark: #0f172a;
            --bg-nav: #09261a;
            --border-glass: rgba(178, 217, 105, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            overflow: hidden;
        }

        /* BARRA DE NAVEGAÇÃO SUPERIOR */
        .top-nav {
            background: linear-gradient(135deg, #041f14 0%, #004A2F 60%, #0b3824 100%);
            min-height: 65px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid var(--usa-verde-claro);
            position: relative;
            z-index: 9999;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            height: 40px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .tabs-container {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.35);
            padding: 5px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            padding: 10px 22px;
            border: none;
            background: transparent;
            font-weight: 700;
            color: #cbd5e1;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--usa-verde-claro), #8bc34a);
            color: #002e1c;
            box-shadow: 0 4px 15px rgba(178, 217, 105, 0.35);
            transform: translateY(-1px);
        }

        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .header-title {
            font-weight: 800;
            color: #ffffff;
            font-size: 13px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--usa-verde-claro);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--usa-verde-claro);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(178, 217, 105, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(178, 217, 105, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(178, 217, 105, 0); }
        }

        /* ÁREA DOS SISTEMAS */
        .viewport {
            height: calc(100vh - 69px);
            width: 100%;
            background: var(--bg-dark);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }

        @media (max-width: 768px) {
            .top-nav {
                padding: 10px 15px;
                justify-content: center;
            }
            .logo img { height: 32px; }
            .header-title { display: none; }
            .tabs-container {
                width: 100%;
                justify-content: center;
            }
            .tab-btn {
                padding: 8px 12px;
                font-size: 11px;
                flex: 1;
                justify-content: center;
            }
            .viewport {
                height: calc(100vh - 110px);
            }
        }
    </style>
</head>
<body>

<header class="top-nav">
    <div class="logo">
        <img src="https://site.usinasantaadelia.com.br/wp-content/uploads/2018/05/img_logo.png" alt="Santa Adélia">
    </div>

    <nav class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('pesada', this)">🚛 Frota Pesada (Pranchas)</button>
        <button class="tab-btn" onclick="switchTab('direcionados', this)">🚗 Logística Direcionada (Carros)</button>
    </nav>

    <div class="header-title">
        <span class="pulse-dot"></span> PAINEL CENTRAL
    </div>
</header>

<main class="viewport">
    <iframe id="iframe-pesada" src="Dashboard.html" class="active"></iframe>
    <iframe id="iframe-direcionados" src="CENTRAL PRANCHAS copy.html"></iframe>
</main>

<script>
    function switchTab(id, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('iframe').forEach(frame => frame.classList.remove('active'));
        const targetFrame = document.getElementById('iframe-' + id);
        targetFrame.classList.add('active');

        targetFrame.contentWindow.location.reload();
    }
</script>

</body>
</html>
